# Coque iPhone de Sommelle, générée par XcodeGen (`xcodegen generate`).
# Version affichée : MARKETING_VERSION ci-dessous est la source unique (Info.plist et l'écran la lisent) ; à aligner sur l'étiquette Android.
name: Sommelle
options:
  bundleIdPrefix: fr.sommelle
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.5.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sommelle:
    type: application
    platform: iOS
    sources:
      - Sommelle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sommelle.app
        PRODUCT_NAME: Sommelle
        INFOPLIST_FILE: Sommelle/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework SommelleShared
    preBuildScripts:
      - name: Compiler le module shared
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
